name: Update Plugin Index

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *' # daily at 06:15 UTC

jobs:
  update-plugins:
    name: Generate plugins2.json
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v5
      with:
        ref: gh-pages

    - name: Checkout plugins repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v5
      with:
        repository: avogadro/plugins
        path: plugins

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install requests PyGithub

    - name: Generate plugin index
      run: python scripts/generate_index.py -t ${{ secrets.GITHUB_TOKEN }} repositories.toml
      working-directory: plugins

    - name: Move plugins2.json to root
      run: mv plugins/plugins2.json plugins2.json

    - name: Commit and push if changed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add plugins2.json
        git diff --cached --quiet || git commit -m "Update plugins2.json"
        git push
