name: Build Sphinx

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

jobs:
  build-html:
    name: Update website
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v5

    # doxygen XML for breathe, from the latest avogadrolibs release
    - name: Find latest avogadrolibs release
      id: release
      run: |
        tag=$(gh api repos/openchemistry/avogadrolibs/releases/latest --jq .tag_name)
        test -n "$tag"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS}" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Cache doxygen XML
      id: doxygen-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.workspace }}/build/avogadrolibs/docs/xml
        key: v1-doxygen-xml-${{ runner.os }}-${{ steps.release.outputs.image }}-${{ steps.release.outputs.tag }}

    # clone outside the workspace, or the gh-pages deploy's `git add -A`
    # commits it as a submodule and breaks the Pages build
    - name: Clone avogadrolibs
      if: steps.doxygen-cache.outputs.cache-hit != 'true'
      run: |
        git -c advice.detachedHead=false clone -q --depth 1 --branch "$TAG" \
          https://github.com/openchemistry/avogadrolibs.git \
          "$RUNNER_TEMP/avogadrolibs"
      env:
        TAG: ${{ steps.release.outputs.tag }}

    - name: Install doxygen
      if: steps.doxygen-cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install doxygen

    - name: Build doxygen XML
      if: steps.doxygen-cache.outputs.cache-hit != 'true'
      run: |
        src="$RUNNER_TEMP/avogadrolibs"
        out="${{ runner.workspace }}/build/avogadrolibs/docs"
        version="${TAG}"
        mkdir -p "$out"
        sed -e "s|@CMAKE_PROJECT_NAME@|AvogadroLibs|" \
            -e "s|@AvogadroLibs_VERSION@|${version}|" \
            -e "s|@doxygen_output_dir@|${out}|" \
            -e "s|@doxygen_source_dirs@|${src}/avogadro ${src}/docs|" \
            "$src/docs/doxyfile.in" > "$out/doxyfile"
        # later assignments win; only the XML is used
        echo "GENERATE_HTML = NO" >> "$out/doxyfile"
        cd "$src/docs"
        doxygen "$out/doxyfile"
        test -f "$out/xml/index.xml"
      shell: bash
      env:
        TAG: ${{ steps.release.outputs.tag }}

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
      with:
        python-version-file: ".python-version"

    - name: Install Sphinx and requirements
      run: uv sync

    - name: Build Sphinx
      run: |
        cd source
        uv run sphinx-build -j auto -E . ../public
        cd ..
        git status
      shell: bash

    - name: Setup tmate session
      if: ${{ failure() }}
      uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
      timeout-minutes: 30

    - name: Deploy to gh-pages
      if: github.ref == 'refs/heads/main'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git fetch origin gh-pages
        # Move build output out of the working tree before switching branches
        mv public /tmp/sphinx-output
        git checkout -f gh-pages
        cp -r /tmp/sphinx-output/* .
        touch .nojekyll
        git add -A
        git diff --cached --quiet || git commit -m "Deploy to gh-pages from ${GITHUB_SHA::7}"
        git push origin gh-pages
