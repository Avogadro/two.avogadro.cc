name: Update Release Info

on:
  workflow_dispatch:
  schedule:
    - cron: '45 6 * * *' # daily at 06:45 UTC

jobs:
  update-release:
    name: Update release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v5

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install 'requests>=2.32,<3'

    - name: Fetch latest release info
      run: python scripts/releases.py

    - name: Commit and push if changed
      id: commit
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add source/install/releases.json source/install/index.md source/install/versions/ source/conf.py
        if git diff --cached --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          git commit -m "Update release info"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    # Pushes made with GITHUB_TOKEN don't trigger push workflows,
    # but workflow_dispatch is allowed, so start the site build here.
    - name: Rebuild the website
      if: steps.commit.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # rebuild the website and PDF docs
        gh workflow run build.yml --ref main
        gh workflow run build-pdf.yml --ref main
