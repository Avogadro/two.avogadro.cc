name: Build PDF

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'

jobs:
  build-pdf:
    name: Build PDF documentation
    runs-on: ubuntu-latest
    concurrency:
      group: pdf-${{ github.workflow }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v5

    - name: Install TeX Live and fonts
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install \
          texlive-latex-recommended \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-fonts-extra \
          latexmk

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
      with:
        python-version-file: ".python-version"

    - name: Install Sphinx and requirements
      run: uv sync

    - name: Build LaTeX
      run: |
        cd source
        uv run sphinx-build -b latex -j auto -E . ../build/latex

    - name: Get version
      id: version
      run: |
        VERSION=$(curl -s https://api.github.com/repos/openchemistry/avogadrolibs/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Build PDF
      continue-on-error: true
      run: |
        cd build/latex
        latexmk -pdf -dvi- -ps- -interaction=nonstopmode Avogadro.tex

    - name: Rename PDF
      run: cp build/latex/Avogadro.pdf "build/latex/Avogadro-v${VERSION}.pdf"
      env:
        VERSION: ${{ steps.version.outputs.version }}

    - name: Upload PDF artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: Avogadro-v${{ steps.version.outputs.version }}
        path: build/latex/Avogadro-v${{ steps.version.outputs.version }}.pdf
