name: Update Downloads

on:
  workflow_dispatch:
  schedule:
    - cron: '13 6 * * *' # daily at 06:15 UTC

jobs:
  update-plugins:
    name: Update download counts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v5
      with:
        ref: gh-pages

    - name: Checkout scripts from default branch
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v5
      with:
        path: repo
        sparse-checkout: scripts

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install requests

    - name: Generate downloads badge
      run: python repo/scripts/avogadro-downloads.py

    - name: Commit and push if changed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add downloads.svg
        git diff --cached --quiet || git commit -m "Update downloads.svg"
        git push
